services:
  mysql:
    image: mysql:8
    container_name: yjoj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: yjoj
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - yjoj-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [yjoj-network]

  redis:
    image: redis:6
    container_name: yjoj-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - yjoj-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [yjoj-network]

  rabbitmq:
    image: rabbitmq:3.12.6-management
    container_name: yjoj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - yjoj-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [yjoj-network]

  nacos:
    image: nacos/nacos-server:v2.2.0-slim
    container_name: yjoj-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - yjoj-nacos-data:/home/nacos/data
    networks: [yjoj-network]

networks:
  yjoj-network:
    name: yjoj-network

volumes:
  yjoj-mysql-data:
  yjoj-redis-data:
  yjoj-rabbitmq-data:
  yjoj-nacos-data:
