# 本地开发环境：Docker 运行中间件，后端与代码沙箱在 IDEA 中启动。
# docker compose up -d 启动全部环境；单体开发只需 docker compose up -d mysql。
name: oj

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: yjoj
      TZ: Asia/Shanghai
    ports:
      # 避开本机 MySQL 的 3306 和 fit-agent 的 3307。
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在首次初始化空数据卷时执行，不会覆盖已有数据库。
      - ./yjoj-backend/sql/create_table.sql:/docker-entrypoint-initdb.d/01-yjoj.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' yjoj"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:6
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12.6-management
    # RabbitMQ 数据目录与节点名有关，固定主机名以便重建容器后继续读取数据。
    hostname: oj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.2.0-slim
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      # Nacos 2.x 客户端需要额外的 gRPC 端口。
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: unless-stopped

# Compose 自动加上 oj_ 前缀，与其他项目的数据隔离。
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
