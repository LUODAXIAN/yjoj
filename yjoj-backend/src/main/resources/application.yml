spring:
  # Springfox 使用旧版路径匹配器。
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: yjoj-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:yjoj}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
server:
  port: 8121
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
        same-site: lax
  error:
    include-message: always

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

codesandbox:
  url: ${CODE_SANDBOX_URL:http://localhost:8090}
  auth-header: ${CODE_SANDBOX_AUTH_HEADER:auth}
  auth-secret: ${CODE_SANDBOX_AUTH_SECRET:change-me}

knife4j:
  enable: true
